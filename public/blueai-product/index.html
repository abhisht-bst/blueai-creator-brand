<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Resolve all relative script/asset paths against this folder, so the page works at the clean /blueai-product URL too. -->
  <base href="/blueai-product/" />
  <title>BlueAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Space Grotesk — creator-brand's own heading face (globals.css --font-head), loaded for the
       MoneyMaker welcome screen only (moneymaker.jsx), which borrows that page's design theme. -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <!-- Best-guess match for BlueStacks App Player's own UI font, used ONLY by the dark
       ("bluestacks" skin) install dialog — see BS_FONT in install_dialog.jsx. Not a
       confirmed match; falls back to Segoe UI if wrong or slow to load. -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { accent: '#1990FF' } } } };</script>
  <!-- The fake Windows desktop the product window sits on (wallpaper, BlueStacks window,
       OS window frame + titlebar). Deliberately a separate file: none of it is product DS. -->
  <link rel="stylesheet" href="product-scene.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif;
      background: #e2e8f0;
    }
    /* The product window's CONTENT box — still exactly 830px tall (421 x 830, every screen
       inside was designed against it). Its FRAME — border, radius, shadow, and the Windows
       titlebar above it — now lives on .ba-win in product-scene.css, because the window sits
       on a fake Windows desktop instead of a flat page. .ba-win is 866 = 830 + 34 titlebar +
       2 hairline, so this box keeps its full height. `position: relative` is load-bearing:
       every in-app overlay (boot splash, login gate, logout + out-of-credits modals) is
       absolutely positioned against it, which is what scopes them to the window. */
    .ba-app {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
      position: relative;
    }
    button, input, textarea, select { font-family: inherit; }
    /* Shared form-field focus treatment (blue border + soft ring), consistent across Settings + modals. */
    .ba-field { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .ba-field:focus { border-color: #1990FF !important; box-shadow: 0 0 0 3px rgba(25,144,255,0.12); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.32); }

    @keyframes ba-wiggle { 0%,100% { transform: rotate(0deg); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(6deg); } }
    @keyframes ba-ring { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.55); opacity: 0; } }
    @keyframes ba-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    @keyframes ba-breathe { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.4); opacity: 1; } }
    @keyframes ba-bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-7px); } 60% { transform: translateY(-4px); } }
    @keyframes ba-orbit { from { transform: rotate(0deg) translateX(28px) rotate(0deg); } to { transform: rotate(360deg) translateX(28px) rotate(-360deg); } }
    @keyframes ba-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes ba-slide-up { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes ba-cfetti { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx,0),var(--ty,-20px)) scale(0); opacity: 0; } }
    @keyframes ba-border-spin { from { background: linear-gradient(white,white) padding-box, linear-gradient(0deg,#0EA4C5,#7B4CFF,#0EA4C5) border-box; } to { background: linear-gradient(white,white) padding-box, linear-gradient(360deg,#0EA4C5,#7B4CFF,#0EA4C5) border-box; } }
    @keyframes tabFadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .tab-anim { animation: tabFadeUp 0.18s ease; }
    @keyframes ba-shimmer { 0% { background-position: -600px 0; } 100% { background-position: 600px 0; } }
    /* Small spinning ring — the in-chat BlueStacks install progress card (needs_bluestacks.jsx). */
    @keyframes ba-spin { to { transform: rotate(360deg); } }
    .ba-ring-spin { display: inline-block; width: 13px; height: 13px; flex-shrink: 0; border-radius: 50%; border: 2px solid #bfdbfe; border-top-color: #1990FF; animation: ba-spin 0.8s linear infinite; }
    /* Install dialog's background wave (install_dialog.jsx's PixelWave) — two tile-widths drawn
       side by side, scrolled by exactly one tile so the loop is seamless. -400px→0 (not the
       app's existing ba-marquee direction, which goes the other way) so it reads as moving right. */
    @keyframes ba-wave-scroll { from { transform: translateX(-400px); } to { transform: translateX(0); } }
    .ba-wave-scroll { animation: ba-wave-scroll 7s linear infinite; }

    /* ── Chat conversation + feedback (from ChatView Feedback) ── */
    @keyframes baMsgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes baThanksIn { from { opacity: 0; transform: translateX(-3px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes baExpand { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .ba-msg-in { animation: baMsgIn 0.22s ease; }
    .ba-chips-in { animation: baMsgIn 0.22s ease; }
    .ba-thanks-in { animation: baThanksIn 0.2s ease; }
    .ba-fb-btn { transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease, opacity 0.2s ease; }
    .ba-fb-btn:hover { transform: translateY(-1px); }
    .ba-fb-btn:active { transform: scale(0.92); }
    .ba-fb-btn--below:hover { background: #f1f5f9 !important; border-color: #cbd5e1 !important; }
    .ba-fb-btn--below.ba-fb-btn--sel:hover { background: #cbd5e1 !important; }
    .ba-fb-btn--inside:hover { background: rgba(255,255,255,0.9) !important; }
    .ba-fb-btn--inside.ba-fb-btn--sel:hover { background: rgba(255,255,255,1) !important; }
    .ba-chip { transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease; }
    .ba-chip:hover { transform: translateY(-1px); }
    .ba-chip:active { transform: scale(0.96); }
    .ba-chip--below:hover:not(.ba-chip--sel) { background: #f1f5f9 !important; border-color: #cbd5e1 !important; }
    .ba-chip--inside:hover:not(.ba-chip--sel) { background: rgba(255,255,255,0.9) !important; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Shared components (must load first) -->
<script type="text/babel" src="blueai/shared.jsx"></script>
<!-- The Windows desktop scene: wallpaper + BlueStacks App Player window (exposes window.DesktopScene) -->
<script type="text/babel" src="blueai/desktop_scene.jsx"></script>
<!-- "Additional files required" installer dialog — Flow A only now (exposes window.InstallDialog) -->
<script type="text/babel" src="blueai/install_dialog.jsx"></script>
<!-- Boot splash + Shimmer -->
<script type="text/babel" src="blueai/boot_splash.jsx"></script>
<!-- Credits widget -->
<script type="text/babel" src="blueai/credits_widget.jsx"></script>
<!-- Canonical NEW chat home (exposes window.ChatCompare) -->
<script type="text/babel" src="blueai/chat_compare.jsx"></script>
<!-- Onboarding welcome for the logged-out cold start (exposes window.Onboarding) -->
<script type="text/babel" src="blueai/onboarding.jsx"></script>
<!-- MoneyMaker welcome screen's background decoration (exposes window.MoneyMakerBackdrop) -->
<script type="text/babel" src="blueai/moneymaker_backdrop.jsx"></script>
<!-- MoneyMaker welcome screen's full-color step icons (exposes window.MoneyMakerIcons) — must
     load before moneymaker.jsx, which reads window.MoneyMakerIcons at its own top level. -->
<script type="text/babel" src="blueai/moneymaker_icons.jsx"></script>
<!-- MoneyMaker welcome screen's hero logo — glow, ring, mark, grain (exposes window.MoneyMakerLogo)
     — must load before moneymaker.jsx, which reads window.MoneyMakerLogo at its own top level. -->
<script type="text/babel" src="blueai/moneymaker_logo.jsx"></script>
<!-- MoneyMaker welcome screen's steps card (exposes window.MoneyMakerSteps) — must load before
     moneymaker.jsx, which reads window.MoneyMakerSteps at its own top level. -->
<script type="text/babel" src="blueai/moneymaker_steps.jsx"></script>
<!-- MoneyMaker's post-login in-chat card (exposes window.MoneyMakerHomeCard) — must load before
     moneymaker.jsx, which reads window.MoneyMakerHomeCard at its own top level to re-export it. -->
<script type="text/babel" src="blueai/moneymaker_home.jsx"></script>
<!-- MoneyMaker session variant: the welcome screen, plus the re-export that keeps the post-login
     card reachable at window.MoneyMaker.MoneyMakerHome (exposes window.MoneyMaker) -->
<script type="text/babel" src="blueai/moneymaker.jsx"></script>
<!-- "Needs BlueStacks" chat state + the rule that decides when it fires (exposes window.NeedsBluestacks) -->
<script type="text/babel" src="blueai/needs_bluestacks.jsx"></script>
<!-- Chat internals, split out of chat_product.jsx for the 300-line rule. Each resolves its
     siblings at render time, so this order is for readability, not correctness. -->
<script type="text/babel" src="blueai/chat_feedback.jsx"></script>
<script type="text/babel" src="blueai/chat_bubbles.jsx"></script>
<script type="text/babel" src="blueai/product_home.jsx"></script>
<!-- Assembled product chat: the conversation, composer + send rules (exposes window.ProductChat) -->
<script type="text/babel" src="blueai/chat_product.jsx"></script>
<!-- Chat History in-app screen (exposes window.ChatHistory) -->
<script type="text/babel" src="blueai/history.jsx"></script>
<!-- Profile in-app screen + Logout modal (exposes window.Profile) -->
<script type="text/babel" src="blueai/profile.jsx"></script>
<!-- Screen components -->
<script type="text/babel" src="blueai/jobs.jsx"></script>
<script type="text/babel" src="blueai/skills.jsx"></script>
<script type="text/babel" src="blueai/schedule.jsx"></script>
<!-- AI Mode (Cloud vs Hybrid) — used inside settings.jsx (exposes window.AiMode) -->
<script type="text/babel" src="blueai/ai_mode.jsx"></script>
<script type="text/babel" src="blueai/settings.jsx"></script>
<script type="text/babel" src="blueai/login.jsx"></script>
<!-- Bring-your-own-key: out-of-credits popups + credits-screen routes (exposes window.Byok) -->
<script type="text/babel" src="blueai/byok.jsx"></script>
<!-- BYOK Settings section — the canonical add/manage-key surface (extends window.Byok) -->
<script type="text/babel" src="blueai/byok_settings.jsx"></script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

// Deep-linkable starting state, so a review link can point at the exact screen being discussed:
//   ?bs=0                 BlueStacks not installed        ?bai=0   BlueAI not installed
//   ?dlg=blueai           open Flow A's installer          ?ask=…   auto-send that message
// Anything else falls back to "both installed", so a bare URL is unchanged.
const QS = new URLSearchParams(location.search);
const START = (() => {
  const bs = QS.get('bs') !== '0';
  let bai = QS.get('bai') !== '0';
  if (!bs && !bai) bai = true;   // same guard the Preview chips enforce: never both off
  return { bs, bai };
})();

// Live product configuration (frozen — the Tweaks playground is removed).
const CONFIG = {
  credits: 45812,        // matches the live Windows app
  skillsLayout: 'grid',
};

// Live header (newer than the export — matched to the live app screenshots):
// logo · credits pill · New Chat · "?" help menu (Get help / Report Issue) · kebab (Chat History / Profile / Logout).
// Logged-out (onboarding): strips to just the brand lockup — no credits/New Chat/help/kebab, matching the cold start.
function ProductTopBar({ credits, lowDot, isLoggedIn, onNewChat, onOpenHistory, onOpenCredits, onOpenProfile, onLogout }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const menuRef = useRef(null);
  const helpRef = useRef(null);
  useEffect(() => {
    const h = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
      if (helpRef.current && !helpRef.current.contains(e.target)) setHelpOpen(false);
    };
    if (menuOpen || helpOpen) document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [menuOpen, helpOpen]);

  const dropdown = { position: 'absolute', right: 0, top: 'calc(100% + 6px)', minWidth: 190, background: 'white', borderRadius: 10, border: '1px solid #e5e7eb', boxShadow: '0 10px 28px rgba(0,0,0,0.14)', zIndex: 60, overflow: 'hidden', padding: '4px' };
  const item = { display: 'flex', alignItems: 'center', gap: 11, width: '100%', padding: '10px 12px', background: 'none', border: 'none', cursor: 'pointer', fontSize: 14, color: '#1f2937', textAlign: 'left', fontFamily: 'inherit', borderRadius: 8 };
  const hover = (e, on) => { e.currentTarget.style.background = on ? '#f1f5f9' : 'none'; };
  const iconBtn = (active) => ({ background: 'none', border: 'none', cursor: 'pointer', padding: 6, borderRadius: 8, color: active ? '#1990FF' : '#64748b', display: 'flex', alignItems: 'center' });

  const ClockIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9" /><polyline points="12 7 12 12 15 14" /></svg>;
  const PersonIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>;
  const LogoutIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>;
  const DiscordIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="#5865F2"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4c-.07.13-.15.3-.2.43a15.6 15.6 0 0 0-4.6 0A6.5 6.5 0 0 0 9 4c-1.5.26-2.94.71-4.27 1.33C2.06 9.4 1.31 13.36 1.68 17.27a16.2 16.2 0 0 0 4.93 2.5c.4-.54.75-1.12 1.05-1.73-.58-.22-1.13-.49-1.65-.8.14-.1.28-.21.41-.32a11.6 11.6 0 0 0 9.96 0c.13.11.27.22.41.32-.52.31-1.07.58-1.65.8.3.61.65 1.19 1.05 1.73a16.2 16.2 0 0 0 4.93-2.5c.44-4.53-.73-8.46-3.1-11.94zM8.52 14.91c-.97 0-1.77-.89-1.77-1.99s.78-1.99 1.77-1.99 1.79.9 1.77 1.99c0 1.1-.79 1.99-1.77 1.99zm6.96 0c-.97 0-1.77-.89-1.77-1.99s.78-1.99 1.77-1.99 1.79.9 1.77 1.99c0 1.1-.78 1.99-1.77 1.99z" /></svg>;
  const WarnIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;

  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', borderBottom: '1px solid #e2e8f0', background: 'white', flexShrink: 0, position: 'relative', zIndex: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
        <img src="assets/Logo.png" alt="BlueAI" style={{ width: 32, height: 32 }} onError={(e) => { e.target.style.display = 'none'; }} />
        <span style={{ background: 'linear-gradient(90deg,#0EA4C5,#7B4CFF)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', fontSize: 22, fontWeight: 700, lineHeight: 1 }}>BlueAI</span>
      </div>
      {isLoggedIn &&
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        {/* Credits pill — opens the AI Credits balance screen */}
        <div onClick={onOpenCredits} role="button" tabIndex={0} aria-label="AI credits"
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpenCredits(); } }}
          style={{ position: 'relative', background: 'linear-gradient(90deg,#0EA4C5,#7B4CFF)', borderRadius: 24, padding: 1.5, cursor: 'pointer' }}>
          {lowDot && <span style={{ position: 'absolute', top: 1, right: 1, width: 8, height: 8, borderRadius: '50%', background: '#ef4444', border: '1.5px solid white' }} />}
          <div style={{ display: 'flex', alignItems: 'center', gap: 5, background: 'white', borderRadius: 24, padding: '5px 10px' }}>
            <img src="assets/Credits.svg" alt="" style={{ width: 14, height: 14 }} onError={(e) => { e.target.style.display = 'none'; }} />
            <span style={{ background: 'linear-gradient(90deg,#0EA4C5,#7B4CFF)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', fontSize: 13, fontWeight: 700 }}>{credits.toLocaleString('en-US')}</span>
          </div>
        </div>
        {/* New Chat */}
        <button onClick={onNewChat}
          style={{ display: 'flex', alignItems: 'center', gap: 5, background: '#1990FF', border: 'none', borderRadius: 999, padding: '6px 13px 6px 9px', fontSize: 13, fontWeight: 600, color: 'white', cursor: 'pointer', fontFamily: 'inherit', flexShrink: 0 }}
          onMouseEnter={(e) => e.currentTarget.style.opacity = '0.88'}
          onMouseLeave={(e) => e.currentTarget.style.opacity = '1'}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
          New Chat
        </button>
        {/* Help (?) menu */}
        <div ref={helpRef} style={{ position: 'relative' }}>
          <button aria-label="Help" onClick={() => { setHelpOpen((v) => !v); setMenuOpen(false); }} style={iconBtn(helpOpen)}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>
          </button>
          {helpOpen &&
            <div style={dropdown}>
              <button style={item} onClick={() => setHelpOpen(false)} onMouseEnter={(e) => hover(e, true)} onMouseLeave={(e) => hover(e, false)}>{DiscordIcon}Get help</button>
              <button style={item} onClick={() => setHelpOpen(false)} onMouseEnter={(e) => hover(e, true)} onMouseLeave={(e) => hover(e, false)}>{WarnIcon}Report Issue</button>
            </div>}
        </div>
        {/* Kebab menu */}
        <div ref={menuRef} style={{ position: 'relative' }}>
          <button aria-label="More options" onClick={() => { setMenuOpen((v) => !v); setHelpOpen(false); }} style={iconBtn(menuOpen)}>
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" /><circle cx="12" cy="12" r="1.5" /><circle cx="12" cy="19" r="1.5" /></svg>
          </button>
          {menuOpen &&
            <div style={dropdown}>
              <button style={item} onClick={() => { setMenuOpen(false); onOpenHistory && onOpenHistory(); }} onMouseEnter={(e) => hover(e, true)} onMouseLeave={(e) => hover(e, false)}>{ClockIcon}Chat History</button>
              <button style={item} onClick={() => { setMenuOpen(false); onOpenProfile && onOpenProfile(); }} onMouseEnter={(e) => hover(e, true)} onMouseLeave={(e) => hover(e, false)}>{PersonIcon}Profile</button>
              <button style={item} onClick={() => { setMenuOpen(false); onLogout && onLogout(); }} onMouseEnter={(e) => hover(e, true)} onMouseLeave={(e) => hover(e, false)}>{LogoutIcon}Logout</button>
            </div>}
        </div>
      </div>}
    </div>);
}

// AI Credits screen. BYOK is universal (prime + non-prime) and the BYOK toggle is the master
// switch — "whatever they've switched on will work" (PM). So when a key is added AND BYOK is on,
// this screen shows the "running on your own key" state in ANY geo, with the credit balance
// preserved/paused underneath; otherwise it shows the geo-specific credit view.
function AICreditsScreen({ credits, isPrime, primeGeo, keyAdded, byokOn, keyInfo, onManageByok }) {
  const byokActive = keyAdded && byokOn;
  const star = { background: 'linear-gradient(135deg,#0EA4C5,#7B4CFF)', WebkitMaskImage: 'url(assets/Credits.svg)', WebkitMaskSize: 'contain', WebkitMaskRepeat: 'no-repeat', WebkitMaskPosition: 'center', maskImage: 'url(assets/Credits.svg)', maskSize: 'contain', maskRepeat: 'no-repeat', maskPosition: 'center' };
  const gradText = { background: 'linear-gradient(90deg,#0EA4C5,#7B4CFF)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' };

  // Shared "more ways to get AI credits" section (both states).
  const MORE = [
    { icon: 'share', bg: '#FCEDE0', fg: '#EA7B2C', title: 'Earn 1,000 Free AI Credits', sub: 'Spread the word about BlueAI' },
    { icon: 'code',  bg: '#EDE9FE', fg: '#7C3AED', title: 'Claim 25,000 AI Credits',    sub: 'Join the developer program' },
  ];
  const moreWays = (
    <div style={{ padding: '4px 18px 24px' }}>

  const isLoading = !homeReady;
  const DEFAULT_KEY = { provider: 'Anthropic', model: 'claude-haiku-4-5', key: 'sk-ant-9Xsjhdw1qAAA' };
  const credits = zeroCredits ? 0 : (primeGeo ? (creditsPrime ? 49812 : 505) : 500);  // non-prime geo starts on 500 free credits
  const byokActive = keyAdded && byokOn;                   // running on the user's own key (any geo)
  const lowDot = credits < 1000 && !byokActive;            // low/empty warning — suppressed while on own key (credits paused)
  const addKey = (info) => { setKeyInfo(info || DEFAULT_KEY); setKeyAdded(true); setByokOn(true); setOocOpen(false); };
  const removeKey = () => { setKeyInfo(null); setKeyAdded(false); };
  // Route into Settings › BYOK (from the out-of-credits popup or the credits-screen row): open
  // Settings, turn BYOK on, and pulse-highlight the section so it's obvious where to add the key.
  const goToByokSettings = () => {
    setOocOpen(false); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false);
    setByokOn(true); setActiveTab('settings'); setHighlightByok(true);
    setTimeout(() => setHighlightByok(false), 2000);
  };
  // After the splash fades, let the skeleton linger briefly, then settle the content in.
  const handleBootDone = () => { setBooting(false); setTimeout(() => setHomeReady(true), 850); };

  /* ── Desktop: opening / closing / installing the BlueAI window ───────────────────────────
     Opening the window is always a COLD START — the boot splash replays and the chat resets,
     because that is what launching a Windows app does. */
  const openWindow = () => {
    setWinOpen(true);
    setWinJustIn(true); setTimeout(() => setWinJustIn(false), 380);
    setBooting(true); setHomeReady(false);
    setSessionKey((k) => k + 1);
    setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); setLogoutOpen(false);
    setActiveTab('chat'); setSeed(null);
  };
  const winPresent = baiInstalled && winOpen;
  // The BlueStacks window is only clickable when the click DOES something: install BlueAI, or
  // reopen a BlueAI window that was closed with ✕. Otherwise it is scenery.
  // …and never while its own dialog is up, so a click on the dimmed player can't re-fire it.
  const bsLive = (!baiInstalled || !winOpen) && !installing;
  const bsTitle = !baiInstalled ? 'Install BlueAI' : (!winOpen ? 'Open BlueAI' : null);
  const handleBsClick = () => {
    if (!baiInstalled) { setInstalling('blueai'); return; }   // Flow A: the install prompt
    if (!winOpen) openWindow();                                // already installed → just relaunch
  };
  const finishInstall = () => {
    if (installing === 'blueai') { setBaiInstalled(true); setInstalling(null); openWindow(); }
  };

  /* Flow B's scene-level payoff — mount the BlueStacks window and cycle it through its cold-start
     frames. Called by ChatScreen's inline progress card (needs_bluestacks.jsx's ProgressBubble)
     once IT finishes, not by a modal's onComplete — Flow B has no modal anymore. The chat side
     (resuming the original task) is handled entirely inside ChatScreen itself now; this function
     only owns what the DESKTOP SCENE needs to do, which is genuinely parent-owned state. */
  const completeBluestacksInstall = (app) => {
    const B = window.NeedsBluestacks.BS_BOOT;
    setBsInstalled(true);
    setBsScreen('loading');                                       // the player cold-starts…
    setTimeout(() => setBsScreen('home'), B.loading);              // …lands on its home…
    // …then the app's Play listing, but ONLY for an app we hold a listing screenshot of.
    // Otherwise it rests on the home screen rather than showing the wrong app's page.
    const listing = window.NeedsBluestacks.PLAY_FRAME[app];
    if (listing) setTimeout(() => setBsScreen(listing), B.loading + B.home);
  };
  /* Preview panel: flip either install flag. GUARD — turning the last one off would leave a bare
     desktop with nothing on it and no way back, which is not a designed state, so the other one
     turns on instead of allowing it. */
  const toggleInstalled = (which, val) => {
    setInstalling(null);
    if (which === 'bs') {
      setBsInstalled(val);
      if (val) setBsScreen('home');
      if (!val && !baiInstalled) { setBaiInstalled(true); openWindow(); }
    } else {
      setBaiInstalled(val);
      if (val) openWindow();
      if (!val && !bsInstalled) { setBsInstalled(true); setBsScreen('home'); }
    }
  };

  // Chat History / Profile open as full in-app screens (kebab menu routes here).
  const openHistory = () => { setCreditsOpen(false); setProfileOpen(false); setHistoryOpen(true); };
  const openProfile = () => { setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(true); };
  useEffect(() => { window.__openChatHistory = openHistory; return () => { delete window.__openChatHistory; }; }, []);

  const handleNewChat = () => { setSeed(null); setSessionKey((k) => k + 1); setActiveTab('chat'); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); setLogoutOpen(false); };
  // Onboarding sign-in completes → the message that opened the gate auto-sends in the now
  // logged-in DEFAULT flow (so the conversation starts and the category home is skipped —
  // designer's correction). A fresh sign-in with no queued message just lands on the home.
  // sessionKey bump resets ChatScreen; the autorun seed then fires the queued message.
  const handleLoginSuccess = () => {
    setShowLoginModal(false);
    setIsLoggedIn(true);
    // MoneyMaker: nothing was typed/queued — the CTA on the welcome page opened this directly —
    // so just reveal the chat home as-is, no seed/sessionKey churn.
    if (loginFlow === 'moneymaker') return;
    setSessionKey((k) => k + 1);
    setSeed(pendingMessage ? { text: pendingMessage, autorun: true, n: Date.now() } : null);
    setPendingMessage(null);
  };
  // Preview-only: flip the Onboarding/Default/MoneyMaker session toggle. The two logged-out
  // variants always re-arm at their start (the chrome-free welcome screen); Default lands on a
  // clean chat tab, already signed in.
  const switchSession = (mode) => { setSessionMode(mode); setIsLoggedIn(mode === 'default'); setOnbPhase('welcome'); setSeed(null); setPendingMessage(null); setSessionKey((k) => k + 1); setActiveTab('chat'); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); };
  // Onboarding picker → chat: prefill the composer with the picked task (empty for "Just type it").
  const startOnboardingChat = (prompt) => { setSeed(prompt ? { text: prompt, n: Date.now() } : null); setSessionKey((k) => k + 1); setActiveTab('chat'); setOnbPhase('chat'); };
  const handleTrySkill = (skillObj) => {
    const text = typeof skillObj === 'string'
      ? skillObj
      : (skillObj && (skillObj.prompt || skillObj.title || skillObj.name)) || '';
    setSeed({ text, n: Date.now() });
    setActiveTab('chat');
  };
  const handleTabChange = (tab) => { setActiveTab(tab); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); if (tab !== 'chat') setSeed(null); };
  // MoneyMaker's welcome page IS the "please sign in" screen, so its CTA opens LoginModal
  // straight past the 'default' step (see login.jsx's initialStep).
  const handleMoneyMakerSignIn = () => { setLoginFlow('moneymaker'); setShowLoginModal(true); };

  const isChat = activeTab === 'chat';
  // Logged-out cold start sits on the chrome-free welcome picker (no top bar, no bottom nav) —
  // matches the design's picker phase. Once a task is picked / "just type it", we enter the chat.
  const onboardingWelcome = !isLoggedIn && onbPhase === 'welcome';

  /* Dev-only preview control — DARK (designer, 2026-08-10: the white card was pulling attention
     off the work). It is a tool sitting on a desktop, not product UI, so it deliberately shares
     nothing with the product's light system: near-black surface, muted ink, and it rests at 88%
     opacity, coming fully forward only on hover. */
  const DEV = {
    surface: '#111524', line: '#242a40', divider: '#1e2335',
    label: '#5f688a', ink: '#8790a8', inkHi: '#c3cade',
    track: '#1b2033', on: '#1a6fc4', onInk: '#ffffff',
    chipOn: 'rgba(25,144,255,0.13)', chipOnLine: '#2f5f96', chipOnInk: '#7db8f5',
    chipOffLine: '#2a3048', chipOffInk: '#6b7390', box: '#3a4160'
  };

  // Compact segmented control sharing one inner track (no per-pill shadow). 3+ options (e.g.
  // Session's Onboarding/Default/MoneyMaker) get the label on its own line above a full-width
  // track instead of squeezing both onto one row — that's what was pushing MoneyMaker past the
  // card's edge. flexWrap is a safety net, not the fix: a still-too-narrow track wraps instead of
  // spilling outside the rounded card.
  const PreviewRow = ({ label, opts, val, set }) => {
    const stacked = opts.length > 2;
    const track = (
      <div style={{ display: 'flex', flexWrap: 'wrap', background: DEV.track, borderRadius: 8, padding: 2, width: stacked ? '100%' : undefined, boxSizing: 'border-box' }}>
        {opts.map(([lbl, v]) => (
          <button key={lbl} onClick={() => set(v)}
            style={{ flex: stacked ? 1 : undefined, border: 'none', borderRadius: 6, padding: '4px 10px', fontSize: 11.5, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', whiteSpace: 'nowrap', background: val === v ? DEV.on : 'transparent', color: val === v ? DEV.onInk : DEV.ink, transition: 'background 0.13s ease, color 0.13s ease' }}>
            {lbl}
          </button>
        ))}
      </div>
    );
    return stacked ? (
      <div style={{ padding: '8px 0' }}>
        <span style={{ display: 'block', fontSize: 10.5, fontWeight: 700, color: DEV.label, marginBottom: 6 }}>{label}</span>
        {track}
      </div>
    ) : (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, padding: '8px 0' }}>
        <span style={{ fontSize: 10.5, fontWeight: 700, color: DEV.label }}>{label}</span>
        {track}
      </div>
    );
  };

  /* Two INDEPENDENT booleans, so they get checkbox chips rather than PreviewRow's either/or
     segments — a segmented pair would imply picking one excludes the other, which is the
     opposite of the model. */
  const InstallChip = ({ label, on, onToggle }) => (
    <button role="checkbox" aria-checked={on} onClick={() => onToggle(!on)}
      style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 6, padding: '6px 8px', borderRadius: 8, cursor: 'pointer', fontFamily: 'inherit', fontSize: 11, fontWeight: 700, textAlign: 'left', transition: 'background 0.13s ease, border-color 0.13s ease, color 0.13s ease', background: on ? DEV.chipOn : 'transparent', border: '1px solid ' + (on ? DEV.chipOnLine : DEV.chipOffLine), color: on ? DEV.chipOnInk : DEV.chipOffInk }}>
      <span style={{ width: 13, height: 13, flexShrink: 0, borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? '#1990FF' : 'transparent', border: '1px solid ' + (on ? '#1990FF' : DEV.box) }}>
        {on && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></svg>}
      </span>
      {label}
    </button>
  );

  /* The installer belongs to the app that raises it, so it renders INSIDE that app's window —
     centred on it, dimming it and nothing else. Only Flow A uses this now (BlueStacks raising
     the prompt to install BlueAI); Flow B's install lives entirely inside the chat instead. */
  const installerCfg = INSTALLERS[installing];
  const bsInstaller = installerCfg
    ? <window.InstallDialog open contained {...installerCfg}
        onCancel={() => setInstalling(null)} onComplete={finishInstall} />
    : null;

  const productWindow = (
    <div className={'ba-win' + (winJustIn ? ' pscene-win-in' : '')}>
      <ProductTitlebar onClose={() => setWinOpen(false)} />
      <div className="ba-app">
      {onboardingWelcome ? (
        sessionMode === 'moneymaker' ? (
          <window.MoneyMaker.MoneyMakerWelcome onSignIn={handleMoneyMakerSignIn} />
        ) : (
          <window.Onboarding.OnboardingWelcome
            onPick={(item) => startOnboardingChat(item.prompt)}
            onTypeIt={() => startOnboardingChat('')} />
        )
      ) : (
      <>
      <ProductTopBar
        credits={credits}
        lowDot={lowDot}
        isLoggedIn={isLoggedIn}
        onNewChat={handleNewChat}
        onOpenCredits={() => { setHistoryOpen(false); setProfileOpen(false); setCreditsOpen(true); }}
        onOpenHistory={openHistory}
        onOpenProfile={openProfile}
        onLogout={() => setLogoutOpen(true)} />

      {profileOpen ? (
        <ProfileScreen onSignOut={() => setLogoutOpen(true)} />
      ) : historyOpen ? (
        <HistoryScreen />
      ) : creditsOpen ? (
        <AICreditsScreen credits={credits} isPrime={creditsPrime} primeGeo={primeGeo} keyAdded={keyAdded} byokOn={byokOn} keyInfo={keyInfo} onManageByok={goToByokSettings} />
      ) : activeTab === 'skills' ? (
        <div key="skills" className="tab-anim" style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          <div data-skills-scroll style={{ flex: 1, overflowY: 'auto', padding: '0 16px 8px', scrollbarWidth: 'thin', scrollbarColor: 'rgba(0,0,0,0.15) #e2e8f0' }}>
            <SkillsScreen onTrySkill={handleTrySkill} isLoading={isLoading} layout={CONFIG.skillsLayout} />
          </div>
          <div style={{ flexShrink: 0, background: 'white', borderTop: '1px solid #e2e8f0', boxShadow: '0 -4px 12px rgba(0,0,0,0.06)', padding: '10px 14px' }}>
            <button onClick={() => window.__skillsOpenCreate?.('instruction')}
              style={{ display: 'flex', alignItems: 'center', gap: 12, width: '100%', padding: '11px 16px', background: 'linear-gradient(135deg,#0EA4C5,#7B4CFF)', border: 'none', borderRadius: 12, cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left', transition: 'opacity 0.15s' }}
              onMouseEnter={e => e.currentTarget.style.opacity = '0.9'}
              onMouseLeave={e => e.currentTarget.style.opacity = '1'}>
              <div style={{ width: 34, height: 34, borderRadius: '50%', background: 'rgba(255,255,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
              </div>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 13.5, fontWeight: 800, color: 'white', lineHeight: 1.2, margin: 0 }}>Build a custom skill</p>
                <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.78)', lineHeight: 1.3, margin: 0 }}>Design your own automation</p>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" strokeWidth="2.5" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
      ) : isChat ? (
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', width: '420px' }}>
          <ProductChatScreen sessionKey={sessionKey} seed={seed} loading={!homeReady} zeroCredits={zeroCredits && !byokActive} onNoCredits={() => setOocOpen(true)} isOnboarding={!isLoggedIn} sessionMode={sessionMode} onNeedLogin={(text) => { setLoginFlow('onboarding'); setPendingMessage(text); setShowLoginModal(true); }} showStates={showChatStates}
            bsInstalled={bsInstalled} onBsInstalled={completeBluestacksInstall} />
        </div>
      ) : (
        <div key={activeTab} className="tab-anim"
          style={{ flex: 1, overflowY: 'auto', scrollbarWidth: 'thin', scrollbarColor: 'rgba(0,0,0,0.15) #e2e8f0', padding: '0px 16px 20px' }}>
          {activeTab === 'jobs' && <JobsScreen isLoading={isLoading} />}
          {activeTab === 'schedule' && <ScheduleScreen isLoading={isLoading} />}
          {activeTab === 'settings' && <SettingsScreen byok={{ on: byokOn, setOn: setByokOn, keyAdded, keyInfo, onSave: addKey, onRemove: removeKey, highlight: highlightByok }} aiModeConditions={{ hwSupported: aiHwSupported, conflict: aiConflict }} />}
        </div>
      )}

      <FreeCreditsWidget triggerStyle="none" />
      <BottomNavbar activeTab={creditsOpen || historyOpen || profileOpen ? null : activeTab} onTabChange={handleTabChange} />
      </>
      )}
      <LoginModal
        isOpen={showLoginModal}
        variant="onboarding"
        initialStep={loginFlow === 'moneymaker' ? 'browser' : 'default'}
        onClose={() => { setShowLoginModal(false); setPendingMessage(null); }}
        onSuccess={handleLoginSuccess} />

      <LogoutModal
        isOpen={logoutOpen}
        onCancel={() => setLogoutOpen(false)}
        onConfirm={() => { setLogoutOpen(false); setProfileOpen(false); setActiveTab('chat'); }} />

      {/* Out-of-credits popup on message-send: prime geo → Prime upsell (image 1); non-prime geo → BYOK (image 2). */}
      {oocOpen && <window.Byok.OutOfCreditsModal mode={!primeGeo ? 'byok' : (creditsPrime ? 'topup' : 'prime')} onClose={() => setOocOpen(false)} onAddKey={goToByokSettings} />}

      {booting && <BootSplash onDone={handleBootDone} />}
      </div>
    </div>);

  /* The scene wraps the window; the installer dialog and the dev Preview card sit OUTSIDE it.
     That placement is load-bearing, not tidiness: .pscene-scaler carries a transform, which makes
     it the containing block for any position:fixed descendant — anything fixed rendered inside it
     would be positioned against the scene AND scaled with it. */
  return (
    <>
      <window.DesktopScene
        bsInstalled={bsInstalled}
        winPresent={winPresent}
        bsScreen={bsScreen}
        bsLive={bsLive}
        bsTitle={bsTitle}
        onBsClick={handleBsClick}
        onEmptyClick={openWindow}
        bsOverlay={bsInstaller}>
        {winPresent && productWindow}
      </window.DesktopScene>

      {/* Preview-state dev control — ONE compact card (geo → member/key + credits), collapses to a gear. */}
      {previewOpen ? (
        /* Bottom-LEFT, not bottom-right: the product window always sits on the right of the
           scene (or centred alone), so a right-docked panel covered its bottom nav. The far
           side can only ever graze the BlueStacks screenshot, which is scenery. */
        <div
          onMouseEnter={(e) => e.currentTarget.style.opacity = '1'}
          onMouseLeave={(e) => e.currentTarget.style.opacity = '0.88'}
          style={{ position: 'fixed', left: 20, bottom: 20, zIndex: 300, width: 300, background: DEV.surface, border: '1px solid ' + DEV.line, borderRadius: 12, boxShadow: '0 12px 38px rgba(0,0,0,0.5)', padding: '9px 14px 11px', opacity: 0.88, transition: 'opacity 0.16s ease' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 2 }}>
            <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: '0.09em', color: DEV.label, textTransform: 'uppercase' }}>Preview</span>
            <button aria-label="Collapse preview" onClick={() => setPreviewOpen(false)}
              style={{ background: 'none', border: 'none', cursor: 'pointer', color: DEV.chipOffInk, padding: 2, display: 'flex' }}
              onMouseEnter={(e) => e.currentTarget.style.color = DEV.inkHi} onMouseLeave={(e) => e.currentTarget.style.color = DEV.chipOffInk}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9" /></svg>
            </button>
          </div>
          {/* Progressive disclosure — mirror the product's real dependency chain so only the
             controls that affect the CURRENT screen show. BYOK is universal (prime + non-prime)
             and its toggle is the master switch — "whatever they've switched on will work":
               Session ─ Onboarding (logged out) → nothing else applies
                       └ Default (logged in) → Geo
                            ├ Prime geo → Membership + Own key + Credits*
                            └ Non-prime geo → Own key + Credits*
               (*Credits hidden while running on the user's own key — credits are paused, not consumed.)
             The Own-key toggle mirrors Settings: "Added" flips both keyAdded + byokOn on, so the
             preview state stays in sync with what Settings shows and vice-versa. */}
          {/* What's installed on this PC. Sits at the TOP because it gates everything below it —
             with BlueAI not installed there is no app to configure, so the rest is hidden. */}
          <div style={{ padding: '7px 0 8px' }}>
            <span style={{ display: 'block', fontSize: 9.5, fontWeight: 800, letterSpacing: '0.09em', color: DEV.label, textTransform: 'uppercase', marginBottom: 6 }}>Installed</span>
            <div style={{ display: 'flex', gap: 6 }}>
              <InstallChip label="BlueStacks" on={bsInstalled} onToggle={(v) => toggleInstalled('bs', v)} />
              <InstallChip label="BlueAI" on={baiInstalled} onToggle={(v) => toggleInstalled('bai', v)} />
            </div>
          </div>
          {baiInstalled && <div style={{ height: 1, background: DEV.divider }} />}
          {baiInstalled && (() => {
            const rows = [
              <PreviewRow key="session" label="Session" opts={[['Onboarding', 'onboarding'], ['Default', 'default'], ['MoneyMaker', 'moneymaker']]} val={sessionMode} set={switchSession} />
            ];
            if (isChat) rows.push(<PreviewRow key="states" label="Chat states" opts={[['Off', false], ['On', true]]} val={showChatStates} set={setShowChatStates} />);
            if (activeTab === 'settings') {
              rows.push(<PreviewRow key="aihw" label="Hardware" opts={[['Yes', true], ['No', false]]} val={aiHwSupported} set={setAiHwSupported} />);
              rows.push(<PreviewRow key="aiconflict" label="AI conflict" opts={[['None', false], ['Detected', true]]} val={aiConflict} set={setAiConflict} />);
            }
            if (isLoggedIn) {
              rows.push(<PreviewRow key="geo" label="Geo" opts={[['Prime geo', true], ['Non-prime geo', false]]} val={primeGeo} set={setPrimeGeo} />);
              if (primeGeo) rows.push(<PreviewRow key="membership" label="Membership" opts={[['Prime', true], ['Free', false]]} val={creditsPrime} set={setCreditsPrime} />);
              rows.push(<PreviewRow key="key" label="Own key" opts={[['Off', false], ['On', true]]} val={byokActive} set={(v) => { setKeyAdded(v); setByokOn(v); setKeyInfo(v ? DEFAULT_KEY : null); }} />);
              if (!byokActive) rows.push(<PreviewRow key="credits" label="Credits" opts={[['Full', false], ['Empty', true]]} val={zeroCredits} set={setZeroCredits} />);
            }
            return rows.map((row, i) => (
              <React.Fragment key={row.key}>
                {i > 0 && <div style={{ height: 1, background: DEV.divider }} />}
                {row}
              </React.Fragment>
            ));
          })()}
        </div>
      ) : (
        <button aria-label="Preview state" onClick={() => setPreviewOpen(true)}
          style={{ position: 'fixed', left: 20, bottom: 20, zIndex: 300, width: 38, height: 38, borderRadius: '50%', background: DEV.surface, border: '1px solid ' + DEV.line, boxShadow: '0 10px 28px rgba(0,0,0,0.5)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: DEV.chipOffInk, opacity: 0.88, transition: 'opacity 0.16s ease' }}
          onMouseEnter={(e) => { e.currentTarget.style.color = DEV.chipOnInk; e.currentTarget.style.opacity = '1'; }} onMouseLeave={(e) => { e.currentTarget.style.color = DEV.chipOffInk; e.currentTarget.style.opacity = '0.88'; }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        </button>
      )}
    </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
